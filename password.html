<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Recuperar Acceso - Alfatek Energy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --color-primary: #0fb1a5; --color-secondary: #575656; --color-primary-hover: #0c8a80; }
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; font-family: sans-serif; }
        .register-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        #recoveryForm { display: flex; flex-direction: column; gap: 18px; }
        
        .input-group-custom { position: relative; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--color-secondary); opacity: 0.5; z-index: 5; }
        .form-control { padding-left: 45px; padding-top: 14px; padding-bottom: 14px; border: 2px solid #e0e0e0; border-radius: 10px; transition: all 0.3s ease; }
        .form-control:focus { border-color: var(--color-primary); box-shadow: 0 0 0 0.25rem rgba(15, 177, 165, 0.15); outline: none; }
        
        .btn-custom-primary { background-color: var(--color-primary) !important; color: white !important; padding: 14px; border-radius: 10px; border: none; width: 100%; font-weight: 600; transition: all 0.3s ease; margin-top: 5px; }
        .btn-custom-primary:hover:not(:disabled) { background-color: var(--color-primary-hover) !important; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(15, 177, 165, 0.4); }
        
        .alert-custom { display: none; padding: 12px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 15px; }
        .alert-success { background-color: #efe; color: #383; border: 1px solid #cfc; display: flex; }
        .alert-error { background-color: #fee; color: #c33; border: 1px solid #fcc; display: flex; }
        
        .back-link { color: var(--color-primary); text-decoration: none; font-weight: 600; transition: color 0.3s ease; }
        .back-link:hover { color: var(--color-primary-hover); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Recuperar Acceso</h2>
            <p class="text-muted small">Ingresa tus datos para notificar al administrador y solicitar el restablecimiento de tu contraseña.</p>
        </div>

        <div id="alertMessage" class="alert-custom"></div>

        <form id="recoveryForm">
            <div class="input-group-custom">
                <i class="bi bi-person-fill input-icon"></i>
                <input class="form-control" id="recNombres" type="text" placeholder="Nombres" required />
            </div>
            <div class="input-group-custom">
                <i class="bi bi-person-fill input-icon"></i>
                <input class="form-control" id="recApellidos" type="text" placeholder="Apellidos" required />
            </div>
            <div class="input-group-custom">
                <i class="bi bi-card-text input-icon"></i>
                <input class="form-control" id="recDNI" type="text" placeholder="DNI" maxlength="8" onkeypress="return (event.charCode >= 48 && event.charCode <= 57)" required />
            </div>
            
            <button type="submit" class="btn-custom-primary" id="recBtn">
                <span id="btnText">Notificar al Administrador</span>
            </button>
        </form>

        <div class="text-center mt-3">
            <p class="small"><a href="login.html" class="back-link"><i class="bi bi-arrow-left"></i> Volver al login</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDg7Ter_I5ryqyhE_fN9DHsSOL_ftPy80c",
            authDomain: "proyectohinca-5ef9d.firebaseapp.com",
            projectId: "proyectohinca-5ef9d",
            storageBucket: "proyectohinca-5ef9d.firebasestorage.app",
            messagingSenderId: "383985129091",
            appId: "1:383985129091:web:c87906eca43813ac6d2db6",
            measurementId: "G-M1KBY490YC"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const recoveryForm = document.getElementById('recoveryForm');
        const alertMessage = document.getElementById('alertMessage');

        recoveryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('recBtn');
            btn.disabled = true;
            document.getElementById('btnText').textContent = "Enviando notificación...";

            try {
                await addDoc(collection(db, "Solicitudes_Cambio_Pass"), {
                    Nombres: document.getElementById('recNombres').value,
                    Apellidos: document.getElementById('recApellidos').value,
                    DNI: document.getElementById('recDNI').value,
                    fechaSolicitud: new Date(),
                    estado: 'pendiente'
                });

                alertMessage.className = "alert-custom show alert-success";
                alertMessage.textContent = "Solicitud enviada. El administrador revisará tu petición.";
                recoveryForm.reset();
            } catch (error) {
                alertMessage.className = "alert-custom show alert-error";
                alertMessage.textContent = "Error al enviar la solicitud.";
                console.error("Error Firebase:", error);
            } finally {
                btn.disabled = false;
                document.getElementById('btnText').textContent = "Notificar al Administrador";
            }
        });
        
        window.cerrarSesionCompleta = function() {
            localStorage.removeItem('usuarioAlfatek');
            localStorage.removeItem('usuario_logueado_email');
            localStorage.removeItem('id_usuario_actual');
            sessionStorage.clear();
            
            window.location.href = 'login.html';
        };
    </script>
</body>
</html>
