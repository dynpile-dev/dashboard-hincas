<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Registro - Alfatek Energy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --color-primary: #0fb1a5; --color-secondary: #575656; --color-primary-hover: #0c8a80; }
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; font-family: sans-serif; }
        .register-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        
        /* Contenedor del formulario con espaciado uniforme */
        #registerForm { display: flex; flex-direction: column; gap: 10px; }
        
        .input-group-custom { position: relative; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--color-secondary); opacity: 0.5; z-index: 5; }
        .form-control { padding-left: 45px; padding-top: 14px; padding-bottom: 14px; border: 2px solid #e0e0e0; border-radius: 10px; transition: all 0.3s ease; }
        .form-control:focus { border-color: var(--color-primary); box-shadow: 0 0 0 0.25rem rgba(15, 177, 165, 0.15); outline: none; }
        
        .btn-custom-primary { background-color: var(--color-primary) !important; color: white !important; padding: 14px; border-radius: 10px; border: 1px solid var(--color-primary) !important; width: 100%; font-weight: 600; transition: all 0.3s ease; margin-top: 10px; }
        .btn-custom-primary:hover:not(:disabled) { background-color: var(--color-primary-hover) !important; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(15, 177, 165, 0.4); }
        
        .alert-custom { display: none; padding: 12px; border-radius: 10px; margin-bottom: 5px; font-size: 0.9rem; }
        .alert-success { background-color: #efe; color: #383; border: 1px solid #cfc; display: flex; }
        .alert-error { background-color: #fee; color: #c33; border: 1px solid #fcc; display: flex; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Crear Cuenta</h2>
            <p class="text-muted">Solicita acceso a la plataforma Alfatek.</p>
        </div>

        <div id="alertMessage" class="alert-custom"></div>

        <form id="registerForm">
            <div class="row g-2">
                <div class="col-md-6">
                    <div class="input-group-custom">
                        <i class="bi bi-person-fill input-icon"></i>
                        <input class="form-control" id="regNombres" type="text" placeholder="Nombres" required />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group-custom">
                        <i class="bi bi-person-fill input-icon"></i>
                        <input class="form-control" id="regApellidos" type="text" placeholder="Apellidos" required />
                    </div>
                </div>
            </div>
            
            <div class="input-group-custom">
                <i class="bi bi-card-text input-icon"></i>
                <input class="form-control" id="regDNI" type="text" placeholder="DNI" maxlength="8" 
                       onkeypress="return (event.charCode >= 48 && event.charCode <= 57)" required />
            </div>
            
            <div class="input-group-custom">
                <i class="bi bi-envelope-fill input-icon"></i>
                <input class="form-control" id="regEmail" type="email" placeholder="Correo electrónico" required />
            </div>
            
            <div class="input-group-custom">
                <i class="bi bi-lock-fill input-icon"></i>
                <input class="form-control" id="regPassword" type="password" placeholder="Contraseña" required />
            </div>
            
            <button type="submit" class="btn-custom-primary" id="regBtn">
                <span id="btnText">Solicitar Registro</span>
            </button>
        </form>

        <div class="text-center mt-3">
            <p class="small">¿Ya tienes cuenta? <a href="login.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">Inicia sesión</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE INTEGRADA
        const firebaseConfig = {
            apiKey: "AIzaSyDg7Ter_I5ryqyhE_fN9DHsSOL_ftPy80c",
            authDomain: "proyectohinca-5ef9d.firebaseapp.com",
            projectId: "proyectohinca-5ef9d",
            storageBucket: "proyectohinca-5ef9d.firebasestorage.app",
            messagingSenderId: "383985129091",
            appId: "1:383985129091:web:c87906eca43813ac6d2db6",
            measurementId: "G-M1KBY490YC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const registerForm = document.getElementById('registerForm');
        const alertMessage = document.getElementById('alertMessage');
        const regBtn = document.getElementById('regBtn');
        const btnText = document.getElementById('btnText');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            regBtn.disabled = true;
            btnText.textContent = "Enviando solicitud...";

            try {
                // Guardamos la solicitud en una colección global para que el admin la apruebe
                await addDoc(collection(db, "Solicitudes_Registro"), {
                    Nombres: document.getElementById('regNombres').value,
                    Apellidos: document.getElementById('regApellidos').value,
                    DNI: document.getElementById('regDNI').value,
                    Email: document.getElementById('regEmail').value,
                    Password: document.getElementById('regPassword').value,
                    fechaSolicitud: new Date(),
                    estado: 'pendiente'
                });

                alertMessage.className = "alert-custom show alert-success";
                alertMessage.textContent = "Solicitud enviada correctamente. El administrador revisará tu petición.";
                registerForm.reset();
            } catch (error) {
                console.error("Error Firebase:", error);
                alertMessage.className = "alert-custom show alert-error";
                alertMessage.textContent = "Error al enviar la solicitud. Verifica tu conexión.";
            } finally {
                regBtn.disabled = false;
                btnText.textContent = "Solicitar Registro";
            }
        });

        // ==========================================
        // [INICIO: FUNCIÓN PARA CERRAR SESIÓN SEGURA]
        // ==========================================
        window.cerrarSesionCompleta = function() {
            localStorage.removeItem('usuarioAlfatek');
            localStorage.removeItem('usuario_logueado_email');
            localStorage.removeItem('id_usuario_actual');
            localStorage.removeItem('proyecto_actual_web');
            sessionStorage.clear();
            window.location.href = 'login.html';
        };
        // ==========================================
    </script>
</body>
</html>
